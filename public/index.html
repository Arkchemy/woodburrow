<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Arkchemy</title>
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="/css/site.css">
  </head>
  <body>
    <main class="container">
      
      <!-- NEW: Arkchemy Progress Dashboard Section -->
      <section>
        <h2>Project Progress</h2>
        <div id="arkchemy-dashboard">
          <h3 id="project-headline">Loading...</h3>
          <p>Current Status: <strong id="project-status"></strong></p>
          <h4>Active Projects</h4>
          <ul id="projects-list"></ul>
        </div>
      </section>

      <!-- EXISTING SECTIONS -->
      <section>
        <h2>Contributors</h2>
        <div id="contributors-list" class="project-list contributor-list"></div>
      </section>

      <section>
        <h2>Special Thanks</h2>
        <div id="contributors-special-thanks" class="project-list contributor-list contributor-list-compact"></div>
      </section>

      <section>
        <h2>Repositories</h2>
        <div id="github-repos" class="repos-container open"></div>
      </section>
    </main>

    <!-- Your existing external script -->
    <script src="/js/site.js" defer></script>
    
    <!-- NEW: JSON parsing script -->
    <script>
      fetch('progress.json')
        .then(response => response.json())
        .then(data => {
          // Insert the overall headline
          document.getElementById('project-headline').textContent = data.overall.headline;
          
          // Insert the status state
          document.getElementById('project-status').textContent = data.status.state;
          
          // Loop through the projects array and generate list items
          const projectsList = document.getElementById('projects-list');
          data.projects.forEach(project => {
            const listItem = document.createElement('li');
            listItem.innerHTML = `<strong>${project.name}</strong> (${project.percent}%): ${project.summary}`;
            projectsList.appendChild(listItem);
          });
        })
        .catch(error => console.error('Error loading JSON:', error));
    </script>
  </body>
</html>
