<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Arkchemy</title>
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/worktree.css">
  </head>
  <body>
    <main class="container">
      
      <!-- NEW: Arkchemy Progress Dashboard Section -->
      <section>
        <h2>Project Progress</h2>
        <div id="arkchemy-dashboard">
          <h3 id="project-headline">Loading...</h3>
          <p>Current Status: <strong id="project-status"></strong></p>
          <h4>Active Projects</h4>
          <ul id="projects-list"></ul>
        </div>
      </section>

      <section>
        <h2>What we're working on</h2>
        <div id="worktree-focus" class="worktree-focus"></div>
        <div id="worktree-controls" class="worktree-controls">
          <span id="worktree-counts" class="worktree-counts"></span>
        </div>
        <div id="worktree" class="worktree"></div>
      </section>

      <!-- EXISTING SECTIONS -->
      <section>
        <h2>Contributors</h2>
        <div id="contributors-list" class="project-list contributor-list"></div>
      </section>

      <section>
        <h2>Special Thanks</h2>
        <div id="contributors-special-thanks" class="project-list contributor-list contributor-list-compact"></div>
      </section>

      <section>
        <h2>Repositories</h2>
        <div id="github-repos" class="repos-container open"></div>
      </section>
    </main>

    <!-- Your existing external script -->
    <script src="/js/site.js" defer></script>
    
    <!-- Dashboard: see /js/dashboard.js (kept out of the page so the
         site's Content-Security-Policy can forbid inline script outright
         rather than having to allow it) -->
    <script src="/js/dashboard.js" defer></script>
    <script src="/js/worktree.js" defer></script>
  </body>
</html>
