<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 130" role="img" aria-label="">
  <title>A drifting hot-air balloon</title>
  <defs>
    <linearGradient id="blA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8305f"/><stop offset="1" stop-color="#7a1f4e"/>
    </linearGradient>
    <linearGradient id="blB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd977"/><stop offset="1" stop-color="#f3c34e"/>
